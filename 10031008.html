<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>京阪電車取材行程｜宇治・伏見・大津</title><style>
:root{--ink:#202b37;--muted:#718096;--line:#e4e9ef;--accent:#167d79;--bg:#f4f7f8;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.hero{background:linear-gradient(120deg,#123e48,#167d79);color:white;padding:38px max(20px,calc((100% - 1080px)/2)) 30px}.eyebrow{letter-spacing:.12em;font-size:12px;opacity:.8}.hero h1{margin:10px 0;font-size:clamp(26px,4vw,42px)}.hero p{margin:0;color:#d8efeb}.wrap{max-width:1080px;margin:24px auto;padding:0 18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat,.dayhead,.event{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat b{display:block;font-size:22px}.stat span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{border:1px solid #d4dfdf;background:white;color:var(--ink);border-radius:999px;padding:9px 15px;cursor:pointer}.filters button.active{background:var(--accent);color:white;border-color:var(--accent)}.day{margin:22px 0}.dayhead{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.dayhead h2{font-size:20px;margin:0}.dayhead small{color:var(--muted)}.timeline{margin:14px 0 0 12px;padding-left:22px;border-left:2px solid #cbdedc}.event{position:relative;padding:16px 18px;margin:0 0 12px;box-shadow:0 3px 12px #183b4510}.event:before{content:"";position:absolute;width:10px;height:10px;background:var(--accent);border:3px solid var(--bg);border-radius:50%;left:-30px;top:22px}.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.time{font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums}.tag{background:#e8f4f2;color:#246b67;border-radius:6px;padding:3px 8px;font-size:12px}.event h3{margin:8px 0 6px;font-size:17px}.event p{margin:0;color:#536170;line-height:1.65;font-size:14px}.empty{padding:30px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}@media(max-width:600px){.summary{grid-template-columns:1fr}.hero{padding-top:28px}.dayhead{align-items:flex-start;flex-direction:column}.event{padding:14px}}
</style></head><body><header class="hero"><div class="eyebrow">TRAVEL FIELDWORK · 2026.10.03 — 10.08</div><h1>京阪電車取材行程</h1><p>宇治・伏見・大津｜京都出發的六日取材路線</p></header><main class="wrap"><section class="summary"><div class="stat"><b>6 天</b><span>10/03–10/08</span></div><div class="stat"><b>3 大區域</b><span>伏見・宇治・大津／比叡山</span></div><div class="stat"><b>4 個取材日</b><span>Day 1 – Day 4</span></div></section><div class="filters" id="filters"></div><div id="schedule"></div></main><footer>行程依提供的 Excel 整理；實際交通與營業時間請出發前再次確認。</footer><script>
const items=[{"date": "", "day": "", "time": "10:25-10:45", "duration": "20分", "place": "京都駅 → 四条烏丸", "desc": "地下鉄烏丸線に乗り換え、「四条駅」まで約3分。駅からホテルまで徒歩で移動", "category": "行程"}, {"date": "", "day": "", "time": "10:45-11:10", "duration": "25分", "place": "四条烏丸のホテル", "desc": "荷物を預け、少し休憩・準備", "category": "行程"}, {"date": "", "day": "", "time": "11:15-11:45", "duration": "30分", "place": "四条烏丸 → 中書島駅", "desc": "【便利なアクセス】阪急烏丸駅から電車で河原町駅まで1駅。橋を渡って京阪祇園四条駅へ移動し、京阪本線に乗り換えて中書島駅まで直通", "category": "行程"}, {"date": "", "day": "", "time": "11:50-13:20", "duration": "1小時30分", "place": "サラダの店サンチョ 伏見店", "desc": "【美食】午餐：原酒藏改造的京都在地連鎖洋食屋，價格平實，不喝酒的朋友也能輕鬆享用平價洋食午餐暢遊伏見", "category": "グルメ"}, {"date": "", "day": "", "time": "13:25-14:25", "duration": "1小時", "place": "月桂冠大倉記念館", "desc": "【文化】360年の歴史を持つ昔ながらの酒造りの道具や酒蔵の雰囲気を見学し、日本酒の試飲を楽しむ", "category": "施設"}, {"date": "", "day": "", "time": "14:30-15:20", "duration": "50分", "place": "伏見十石舟", "desc": "【遊覧船】木造の十石舟に乗り、柳並木の水辺や昔ながらの酒蔵が立ち並ぶ景観を楽しむ", "category": "施設"}, {"date": "", "day": "", "time": "15:30-16:50", "duration": "1小時20分", "place": "龍馬通り ＆ 伏見大手筋商店街", "desc": "【散策】坂本龍馬襲撃事件の舞台となった「寺田屋」を訪れ、吟醸酒ソフトクリームや地元グルメを味わう", "category": "食べ歩き"}, {"date": "", "day": "", "time": "16:55-17:35", "duration": "40分", "place": "小倉山荘（伏見店）", "desc": "【ショッピング】有名なせんべい・あられなどのお土産を購入", "category": "ショッピング"}, {"date": "", "day": "", "time": "17:40-19:10", "duration": "1小時30分", "place": "鳥せい 本店（Torisei）", "desc": "【グルメ】昼食：山本本家の旧酒蔵を改装した店舗。日本酒と焼き鳥料理、酒蔵から直接提供される「蔵出し生原酒（神聖）」を味わう", "category": "グルメ（変更希望）"}, {"date": "", "day": "", "time": "19:20-19:50", "duration": "30分", "place": "中書島駅 → 四条烏丸", "desc": "京阪電車で祇園四条駅へ戻り、橋を渡って河原町駅から阪急電車に乗車（1駅）。烏丸駅へ戻り、ホテルでチェックイン・休憩", "category": "行程"}, {"date": "2026-10-06", "day": "Day 2", "time": "08:50-09:05", "duration": "15分", "place": "三条周辺のホテル", "desc": "チェックアウト後、三条駅周辺のホテルに荷物を預ける", "category": "行程"}, {"date": "2026-10-06", "day": "Day 2", "time": "09:10-09:45", "duration": "35分", "place": "三条駅 → 京阪宇治駅", "desc": "【アクセス】三条駅から京阪本線（特急／快速急行）で「中書島駅」へ。宇治線に乗り換え「宇治駅」へ", "category": "行程"}, {"date": "2026-10-06", "day": "Day 2", "time": "09:45-10:00", "duration": "15分", "place": "京阪宇治駅 → 中村藤吉", "desc": "宇治川沿いを散策しながら中村藤吉平等院店へ", "category": "行程"}, {"date": "2026-10-06", "day": "Day 2", "time": "10:00-11:00", "duration": "1小時", "place": "中村藤吉 平等院店", "desc": "【グルメ】10:00の開店に合わせて入店。抹茶スイーツや限定パフェを味わいながら、宇治川の景色を楽しむ", "category": "グルメ"}, {"date": "2026-10-06", "day": "Day 2", "time": "11:05-12:35", "duration": "1小時30分", "place": "福壽園 宇治茶工坊", "desc": "【文化體驗】體驗現場陶板焙煎烘焙茶(福壽園）與茶香囊製作，品嚐現焙茶香", "category": "施設"}, {"date": "2026-10-06", "day": "Day 2", "time": "12:40-13:40", "duration": "1小時", "place": "宇治川周辺 ／ 対鳳庵", "desc": "【茶道体験】対鳳庵で本格的な宇治抹茶の点茶文化を体験", "category": "体験（茶づなに変更可能希望）"}, {"date": "2026-10-06", "day": "Day 2", "time": "13:45-15:05", "duration": "1小時20分", "place": "福寿園 宇治茶工房", "desc": "【文化体験】陶板を使った「ほうじ茶づくり」と「香り袋づくり」を体験し、焙煎したてのお茶の香りを楽しむ", "category": "体験"}, {"date": "2026-10-06", "day": "Day 2", "time": "15:10-16:20", "duration": "1小時10分", "place": "宇治神社 ＆ 宇治上神社", "desc": "【文化】日本最古の神社建築の一つである「宇治上神社」の本殿を参拝", "category": "施設"}, {"date": "2026-10-06", "day": "Day 2", "time": "16:25-17:00", "duration": "35分", "place": "京阪宇治駅 → 三条駅", "desc": "京阪宇治線で中書島駅へ行き、京阪本線に乗り換えて三条駅へ戻る", "category": "行程"}, {"date": "2026-10-07", "day": "Day 3", "time": "08:30-09:10", "duration": "40分", "place": "三条駅 → 比叡山坂本駅", "desc": "【京阪電車体験】三条京阪駅から京阪京津線でびわ湖浜大津駅へ。京阪石山坂本線に乗り換え「坂本比叡山口駅」へ（路面電車が道路上を走る独特の景観を体験）", "category": "行程"}, {"date": "2026-10-07", "day": "Day 3", "time": "09:15-09:25", "duration": "10分", "place": "比叡山坂本駅 → 旧竹林院", "desc": "徒歩で旧竹林院へ", "category": "行程"}, {"date": "2026-10-07", "day": "Day 3", "time": "09:25-10:25", "duration": "1小時", "place": "旧竹林院", "desc": "【朝の光がおすすめ】光が差し込む朝の時間帯に、漆塗りの座卓に庭園が映り込むことで有名な「リフレクション」を鑑賞", "category": "施設"}, {"date": "2026-10-07", "day": "Day 3", "time": "10:30-10:45", "duration": "15分", "place": "旧竹林院 → 坂本ケーブル駅", "desc": "徒歩で坂本ケーブル駅へ", "category": "行程"}, {"date": "2026-10-07", "day": "Day 3", "time": "10:50-11:01", "duration": "11分", "place": "坂本ケーブル", "desc": "【観光】日本最長2,025mのケーブルカーに乗車。途中、琵琶湖の雄大な景色を眺めながら山頂へ", "category": "行程"}, {"date": "2026-10-07", "day": "Day 3", "time": "11:10-12:30", "duration": "1小時20分", "place": "比叡山延暦寺（東塔エリア）", "desc": "【世界遺産】日本仏教の母山・延暦寺を参拝。根本中堂（国宝）、文殊楼などを見学", "category": "施設"}, {"date": "2026-10-07", "day": "Day 3", "time": "12:35-12:46", "duration": "11分", "place": "坂本ケーブル（下山）", "desc": "ケーブルカーで坂本門前町へ戻る", "category": "行程"}, {"date": "2026-10-07", "day": "Day 3", "time": "12:55-14:15", "duration": "1小時20分", "place": "本家 鶴㐂そば 本店", "desc": "【坂本の名物グルメ】300年の歴史を持つ文化財の老舗で、手打ちの門前そばや鴨南蛮を味わう", "category": "グルメ"}, {"date": "2026-10-07", "day": "Day 3", "time": "14:20-15:20", "duration": "1小時", "place": "坂本門前町 ＆ 穴太衆積みの石垣", "desc": "【散策】坂本の古い町並みを歩き、堅牢で独特な「穴太衆積み」の石垣の技術を見学", "category": "散策"}, {"date": "2026-10-07", "day": "Day 3", "time": "15:30-16:10", "duration": "40分", "place": "比叡山坂本駅 → 三条駅", "desc": "【京阪電車で帰路】坂本比叡山口駅から京阪石山坂本線に乗車し、びわ湖浜大津駅で京津線に乗り換え、「三条京阪駅」まで直通", "category": "行程"}, {"date": "2026-10-08", "day": "Day 4", "time": "08:45-09:00", "duration": "15分", "place": "三条周辺のホテル", "desc": "チェックアウト後、ホテルに荷物を預ける", "category": "行程"}, {"date": "2026-10-08", "day": "Day 4", "time": "09:05-09:30", "duration": "25分", "place": "三条京阪駅 → びわ湖浜大津駅", "desc": "【直通アクセス】地下鉄東西線（京阪京津線直通）で「びわ湖浜大津駅」まで直通", "category": "行程"}, {"date": "2026-10-08", "day": "Day 4", "time": "09:35-09:55", "duration": "20分", "place": "大津港", "desc": "徒歩で大津港へ。ミシガンクルーズの乗船手続きを行い、港周辺で撮影", "category": "行程"}, {"date": "2026-10-08", "day": "Day 4", "time": "10:00-11:20", "duration": "1小時20分", "place": "大津港（ミシガンクルーズ）", "desc": "【琵琶湖・クルーズ】10:00発の外輪船「ミシガン」に乗船し、朝の琵琶湖の景色と船内ショーを楽しむ", "category": "施設"}, {"date": "2026-10-08", "day": "Day 4", "time": "11:30-13:00", "duration": "1小時30分", "place": "Modern Meal 大津店", "desc": "【グルメ】昼食：精肉店直営のコストパフォーマンスに優れた「近江牛」の赤身ステーキ／焼肉定食をゆっくり楽しむ（約90分）", "category": "グルメ"}, {"date": "2026-10-08", "day": "Day 4", "time": "13:10-13:35", "duration": "40分", "place": "びわ湖浜大津駅 → 三条京阪駅", "desc": "京阪京津線（地下鉄東西線直通）で三条へ戻り、ホテルで荷物を受け取る", "category": "行程"}, {"date": "2026-10-08", "day": "Day 4", "time": "14:00~", "duration": "-", "place": "三条 → 京都駅 → 関西空港", "desc": "帰国へ。自由時間", "category": "行程"}, {"date": "2026-10-08", "day": "Day 4", "time": "18:30-20:30\n", "duration": "", "place": "関西国際空港 -台北(桃園)空港(BR129)(CI173)", "desc": "", "category": "行程"}];const labels=[['all','全部行程'],['Day0','抵達／自由活動'],['Day 1','Day 1｜伏見'],['Day 2','Day 2｜宇治'],['Day 3','Day 3｜比叡山・坂本'],['Day 4','Day 4｜大津・返程']];let selected='all';const filters=document.querySelector('#filters'),root=document.querySelector('#schedule');
function render(){filters.innerHTML=labels.map(([v,l])=>`<button class="${selected===v?'active':''}" data-v="${v}">${l}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.v;render()});let shown=items.filter(x=>selected==='all'||x.day===selected);let groups={};shown.forEach(x=>(groups[x.day||'行程']=groups[x.day||'行程']||[]).push(x));root.innerHTML=Object.entries(groups).map(([day,arr])=>`<section class="day"><div class="dayhead"><h2>${dayTitle(day)}</h2><small>${arr[0].date||''}　·　${arr.length} 個行程</small></div><div class="timeline">${arr.map(x=>`<article class="event"><div class="meta"><span class="time">${esc(x.time)}</span>${x.duration?`<span>${esc(x.duration)}</span>`:''}<span class="tag">${esc(x.category)}</span></div><h3>${esc(x.place)}</h3>${x.desc?`<p>${esc(x.desc)}</p>`:''}</article>`).join('')}</div></section>`).join('')||'<div class="empty">沒有行程</div>'}
function dayTitle(d){return ({'Day0':'抵達大阪・自由活動','Day 1':'伏見｜酒藏、十石舟與在地美食','Day 2':'宇治｜抹茶、茶文化與神社','Day 3':'比叡山・坂本｜庭園、纜車與延曆寺','Day 4':'大津｜琵琶湖遊船與返程'})[d]||d}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
